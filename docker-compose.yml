version: '3.9'
services:
  app:
    image: "${DOCKER_USERNAME}/${DOCKER_REPO}:latest"
    container_name: catchy-server
    env_file:
      - .env
    ports:
      - "8081:8081"
    volumes:
      - ./src/main/resources/application-prod.yml:/config/application-prod.yml
    networks:
      - catchy-network

  osrm-routed:
    image: osrm/osrm-backend:latest
    container_name: catchy-osrm
    ports:
      - "5000:5000"
    volumes:
      - .:/data
    command: >
      osrm-routed --algorithm mld /data/OSM/south-korea-latest.osrm
    networks:
      - catchy-network

  prometheus:
    image: prom/prometheus:latest
    container_name: catchy-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - catchy-network

  grafana:
    image: grafana/grafana:latest
    container_name: catchy-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - catchy-network

networks:
  catchy-network:
    driver: bridge

volumes:
  grafana-storage: